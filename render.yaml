services:
  - type: web
    name: btag-cf-preview
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      # Add your persistent PostgreSQL connection string in Render's
      # Environment tab. Do not commit database credentials here.
      - key: DATABASE_URL
        sync: false
