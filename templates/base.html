<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BTag CF{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">🐒 BTag CF</a>
    <nav>
      {% if g.user %}
        <a href="{{ url_for('dashboard') }}">my stuff</a>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="nav-button" type="submit">escape</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">log in</a>
        <a class="nav-cta" href="{{ url_for('register') }}">join the monkeys</a>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="notice {{ category }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>made for silly monkeys · BTag CF</footer>
</body>
</html>
